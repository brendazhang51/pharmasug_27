<svg xmlns="http://www.w3.org/2000/svg" width="700" height="845" viewBox="0 0 700 845" role="img" aria-labelledby="title description">
  <title id="title">Continuous-outcome inference workflow</title>
  <desc id="description">JSON configuration builds a self-contained SAS submission. Programs 01 through 03 prepare data, fit ANOVA, ANCOVA and ANHECOVA, and compute predictions and AIPW means. The selected model feeds original inference and joint-calibrated inference. Both paths use Program 05 CAR covariance and Program 06 treatment contrasts. Program 07 compares both paths with prepared RobinCar references before compact export. Arrows show data dependencies rather than simultaneous execution.</desc>
  <rect x="0" y="0" width="700" height="845" fill="#ffffff"/>
  <style>text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }</style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/></marker>
  </defs>
  <text x="350" y="32" font-size="16" font-weight="600" text-anchor="middle" fill="#1e293b">Continuous-outcome inference workflow</text>
  <text x="350" y="52" font-size="10" text-anchor="middle" fill="#64748b">One submission · selected model · original and calibrated estimates</text>
  <path d="M180,135 C180,143 300,140 300,149" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M520,135 C520,143 400,140 400,149" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M350,219 L350,233" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M350,303 L350,317" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M300,387 C300,395 180,392 180,401" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M400,387 C400,395 520,392 520,401" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M180,471 L180,485" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M520,471 L520,485" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M180,555 L180,569" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M520,555 L520,569" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <path d="M180,639 C260,639 435,640 435,653" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <path d="M520,639 L520,653" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M340,691 L354,691" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M520,723 C520,731 350,728 350,737" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <!-- x=25, y=76, width=310, height=54; right=335, bottom=130 -->
  <rect x="25" y="76" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="98.2" font-size="12" text-anchor="middle" fill="#1e40af">JSON configuration + build</text>
  <text x="180" y="116.2" font-size="12" text-anchor="middle" fill="#1e40af">run/project.py → run/run.sas</text>
  <!-- x=365, y=76, width=310, height=54; right=675, bottom=130 -->
  <rect x="365" y="76" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="98.2" font-size="12" text-anchor="middle" fill="#1e40af">Same input CSV</text>
  <text x="520" y="116.2" font-size="12" text-anchor="middle" fill="#1e40af">Local reference copy + server copy</text>
  <!-- x=170, y=160, width=360, height=54; right=530, bottom=214 -->
  <rect x="170" y="160" width="360" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="182.2" font-size="12" text-anchor="middle" fill="#b45309">01 · Import, validate and prepare data</text>
  <text x="350" y="200.2" font-size="12" text-anchor="middle" fill="#b45309">Stop on import, schema or QC failure</text>
  <!-- x=170, y=244, width=360, height=54; right=530, bottom=298 -->
  <rect x="170" y="244" width="360" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="266.2" font-size="12" text-anchor="middle" fill="#b45309">02 · Fit working outcome models</text>
  <text x="350" y="284.2" font-size="12" text-anchor="middle" fill="#b45309">ANOVA / ANCOVA / ANHECOVA</text>
  <!-- x=170, y=328, width=360, height=54; right=530, bottom=382 -->
  <rect x="170" y="328" width="360" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="350" y="350.2" font-size="12" text-anchor="middle" fill="#6b21a8">03 · Predictions + AIPW means</text>
  <text x="350" y="368.2" font-size="12" text-anchor="middle" fill="#6b21a8">Use selected analysis_model downstream</text>
  <!-- x=25, y=412, width=310, height=54; right=335, bottom=466 -->
  <rect x="25" y="412" width="310" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="180" y="434.2" font-size="12" text-anchor="middle" fill="#6b21a8">05 · Original CAR mean inference</text>
  <text x="180" y="452.2" font-size="12" text-anchor="middle" fill="#6b21a8">Simple or permuted-block · type 1</text>
  <!-- x=365, y=412, width=310, height=54; right=675, bottom=466 -->
  <rect x="365" y="412" width="310" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="520" y="434.2" font-size="12" text-anchor="middle" fill="#6b21a8">04 · Joint calibration</text>
  <text x="520" y="452.2" font-size="12" text-anchor="middle" fill="#6b21a8">Recalibrate selected-model predictions</text>
  <!-- x=25, y=496, width=310, height=54; right=335, bottom=550 -->
  <rect x="25" y="496" width="310" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="180" y="518.2" font-size="12" text-anchor="middle" fill="#b45309">06 · Original treatment contrasts</text>
  <text x="180" y="536.2" font-size="12" text-anchor="middle" fill="#b45309">Each arm minus the lowest numeric arm</text>
  <!-- x=365, y=496, width=310, height=54; right=675, bottom=550 -->
  <rect x="365" y="496" width="310" height="54" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="520" y="518.2" font-size="12" text-anchor="middle" fill="#6b21a8">05 · Calibrated CAR mean inference</text>
  <text x="520" y="536.2" font-size="12" text-anchor="middle" fill="#6b21a8">Same randomization design and alpha</text>
  <!-- x=25, y=580, width=310, height=54; right=335, bottom=634 -->
  <rect x="25" y="580" width="310" height="54" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="180" y="602.2" font-size="12" text-anchor="middle" fill="#166534">Original analysis results</text>
  <text x="180" y="620.2" font-size="12" text-anchor="middle" fill="#166534">Means, covariance, SEs, CIs, p-values</text>
  <!-- x=365, y=580, width=310, height=54; right=675, bottom=634 -->
  <rect x="365" y="580" width="310" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="602.2" font-size="12" text-anchor="middle" fill="#b45309">06 · Calibrated treatment contrasts</text>
  <text x="520" y="620.2" font-size="12" text-anchor="middle" fill="#b45309">Means, covariance, SEs, CIs, p-values</text>
  <!-- x=25, y=664, width=310, height=54; right=335, bottom=718 -->
  <rect x="25" y="664" width="310" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="686.2" font-size="12" text-anchor="middle" fill="#1e40af">Prepared RobinCar 1.2.0 references</text>
  <text x="180" y="704.2" font-size="12" text-anchor="middle" fill="#1e40af">Same CSV, model, design and alpha</text>
  <!-- x=365, y=664, width=310, height=54; right=675, bottom=718 -->
  <rect x="365" y="664" width="310" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="520" y="686.2" font-size="12" text-anchor="middle" fill="#b45309">07 · Compare both analysis paths</text>
  <text x="520" y="704.2" font-size="12" text-anchor="middle" fill="#b45309">Settings, population and numeric checks</text>
  <!-- x=170, y=748, width=360, height=72; right=530, bottom=820 -->
  <rect x="170" y="748" width="360" height="72" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="350" y="770.2" font-size="12" text-anchor="middle" fill="#166534">Automatic compact export</text>
  <text x="350" y="788.2" font-size="12" text-anchor="middle" fill="#166534">8 CSVs + full HTML report + PNG plots</text>
  <text x="350" y="806.2" font-size="12" text-anchor="middle" fill="#166534">Extra diagnostics on failure or QC findings</text>
</svg>
